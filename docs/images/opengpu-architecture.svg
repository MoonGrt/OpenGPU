<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenGPU architecture</title>
  <desc id="desc">The native host runtime loads an RV32E kernel into physical memory. A selected C ISS or Verilated RTL backend executes the kernel. The RTL contains configurable GPU cores with warp schedulers and SIMT lanes. DiffTest compares reference and RTL memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102744"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173e68"/>
      <stop offset="1" stop-color="#102e51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d7ff"/>
    </marker>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#f4f9ff}.subtitle{font:400 14px Inter,Arial,sans-serif;fill:#9db3cc}
      .h{font:700 17px Inter,Arial,sans-serif;fill:#fff}.t{font:500 13px Inter,Arial,sans-serif;fill:#c9d8e8}.small{font:500 11px Inter,Arial,sans-serif;fill:#b5c8da}
      .box{stroke-width:1.5;rx:12}.flow{fill:none;stroke:#63d7ff;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="url(#bg)"/>
  <text x="48" y="52" class="title">OpenGPU · RV32E SIMT Verification Platform</text>
  <text x="48" y="78" class="subtitle">One software stack · three RTL implementations · reference-versus-hardware memory comparison</text>

  <!-- Host software -->
  <g filter="url(#shadow)">
    <rect x="48" y="118" width="260" height="190" class="box" fill="#13243a" stroke="#5e7895"/>
    <text x="72" y="151" class="h">Native Host</text>
    <rect x="72" y="171" width="212" height="48" rx="8" fill="#1c3450" stroke="#496b8e"/>
    <text x="178" y="192" class="t" text-anchor="middle">Self-checking application</text>
    <text x="178" y="208" class="small" text-anchor="middle">buffers · arguments · validation</text>
    <rect x="72" y="237" width="212" height="48" rx="8" fill="#153f50" stroke="#37a6ba"/>
    <text x="178" y="258" class="t" text-anchor="middle">OpenGPU Runtime API</text>
    <text x="178" y="274" class="small" text-anchor="middle">alloc · copy · load · launch · wait</text>
  </g>

  <!-- Shared memory -->
  <g filter="url(#shadow)">
    <rect x="48" y="380" width="260" height="190" class="box" fill="#292339" stroke="#9279b5"/>
    <text x="72" y="413" class="h">Shared Physical Memory</text>
    <rect x="72" y="434" width="212" height="42" rx="7" fill="#392e4d" stroke="#8366aa"/>
    <text x="178" y="460" class="t" text-anchor="middle">RV32E kernel image</text>
    <rect x="72" y="486" width="212" height="30" rx="6" fill="#392e4d" stroke="#8366aa"/>
    <text x="178" y="506" class="small" text-anchor="middle">launch metadata + arguments</text>
    <rect x="72" y="526" width="212" height="30" rx="6" fill="#392e4d" stroke="#8366aa"/>
    <text x="178" y="546" class="small" text-anchor="middle">heap + stacks + output buffers</text>
  </g>

  <!-- Backend selection -->
  <g filter="url(#shadow)">
    <rect x="378" y="118" width="236" height="116" class="box" fill="#173444" stroke="#4ca9bd"/>
    <text x="496" y="151" class="h" text-anchor="middle">C ISS Reference</text>
    <text x="496" y="177" class="t" text-anchor="middle">One context per logical hart</text>
    <text x="496" y="199" class="small" text-anchor="middle">golden PMEM result</text>

    <rect x="378" y="266" width="236" height="155" class="box" fill="#23324b" stroke="#738fbe"/>
    <text x="496" y="299" class="h" text-anchor="middle">Selected RTL Backend</text>
    <rect x="400" y="320" width="58" height="38" rx="7" fill="#344b70" stroke="#7898ca"/>
    <rect x="467" y="320" width="58" height="38" rx="7" fill="#344b70" stroke="#7898ca"/>
    <rect x="534" y="320" width="58" height="38" rx="7" fill="#344b70" stroke="#7898ca"/>
    <text x="429" y="343" class="small" text-anchor="middle">Chisel</text>
    <text x="496" y="343" class="small" text-anchor="middle">Spinal</text>
    <text x="563" y="343" class="small" text-anchor="middle">SV</text>
    <text x="496" y="386" class="t" text-anchor="middle">Verilator · common GPUTop ABI</text>
  </g>

  <!-- GPU top -->
  <g filter="url(#shadow)">
    <rect x="684" y="110" width="468" height="484" class="box" fill="#0c1d31" stroke="#2f9ed0" stroke-width="2"/>
    <text x="712" y="146" class="h">GPUTop</text>
    <text x="1125" y="146" class="small" text-anchor="end">NUM_CORES × NUM_WARPS × NUM_THREADS</text>

    <rect x="712" y="169" width="412" height="171" class="box" fill="url(#core)" stroke="#3b83ba"/>
    <text x="732" y="197" class="h">GPU Core 0</text>
    <rect x="734" y="216" width="154" height="92" rx="8" fill="#204d72" stroke="#58a4cf"/>
    <text x="811" y="240" class="t" text-anchor="middle">Warp scheduler</text>
    <text x="811" y="261" class="small" text-anchor="middle">round robin</text>
    <text x="811" y="279" class="small" text-anchor="middle">PC-based issue mask</text>
    <rect x="908" y="207" width="194" height="110" rx="8" fill="#143858" stroke="#4a8db8"/>
    <text x="1005" y="231" class="t" text-anchor="middle">Resident warps</text>
    <rect x="926" y="246" width="48" height="48" rx="6" fill="#25789b"/><rect x="981" y="246" width="48" height="48" rx="6" fill="#25789b"/><rect x="1036" y="246" width="48" height="48" rx="6" fill="#25789b"/>
    <text x="950" y="266" class="small" text-anchor="middle">lane</text><text x="950" y="282" class="small" text-anchor="middle">0</text>
    <text x="1005" y="266" class="small" text-anchor="middle">lane</text><text x="1005" y="282" class="small" text-anchor="middle">1</text>
    <text x="1060" y="274" class="small" text-anchor="middle">…</text>

    <rect x="712" y="359" width="412" height="84" class="box" fill="url(#core)" stroke="#3b83ba"/>
    <text x="732" y="390" class="h">GPU Core 1 … N</text>
    <text x="732" y="417" class="t">Independent scheduler, PCs, halt state, and 16 × RV32E GPRs per lane</text>

    <rect x="712" y="462" width="196" height="99" rx="10" fill="#19384a" stroke="#3897a7"/>
    <text x="810" y="491" class="h" text-anchor="middle">Instruction path</text>
    <text x="810" y="517" class="small" text-anchor="middle">fetch → decode → execute</text>
    <text x="810" y="536" class="small" text-anchor="middle">RV32E + mhartid + ebreak</text>
    <rect x="928" y="462" width="196" height="99" rx="10" fill="#3b2e3b" stroke="#a06e96"/>
    <text x="1026" y="491" class="h" text-anchor="middle">DPI memory</text>
    <text x="1026" y="517" class="small" text-anchor="middle">instruction reads</text>
    <text x="1026" y="536" class="small" text-anchor="middle">lane-serialized loads/stores</text>
  </g>

  <!-- Flows -->
  <path d="M178 308 V380" class="flow"/>
  <text x="190" y="349" class="small">kernel + data</text>
  <path d="M308 461 C342 461 340 176 378 176" class="flow"/>
  <path d="M308 492 C346 492 340 344 378 344" class="flow"/>
  <path d="M614 344 H684" class="flow"/>
  <text x="649" y="334" class="small" text-anchor="middle">launch</text>
  <path d="M928 544 C650 650 410 620 284 548" class="flow"/>
  <text x="610" y="647" class="small" text-anchor="middle">DPI reads / writes</text>

  <!-- DiffTest -->
  <rect x="378" y="474" width="236" height="96" class="box" fill="#342c19" stroke="#d4a93d"/>
  <text x="496" y="506" class="h" text-anchor="middle">DiffTest</text>
  <text x="496" y="532" class="t" text-anchor="middle">C ISS PMEM ≟ RTL PMEM</text>
  <text x="496" y="551" class="small" text-anchor="middle">full-memory final-state check</text>
  <path d="M496 234 V474" class="flow dash"/>
  <path d="M614 522 H660 V406 H684" class="flow dash"/>

  <!-- Legend -->
  <text x="48" y="682" class="small">Control and execution flow</text><line x1="190" y1="678" x2="248" y2="678" class="flow"/>
  <text x="286" y="682" class="small">Dashed paths show reference/result comparison</text>
</svg>
